
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px;
            text-align: center;
        }

        nav {
            background: #1e40af;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .search {
            text-align: center;
            padding: 25px;
        }

        .search input {
            padding: 12px;
            width: 60%;
            max-width: 400px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 25px;
        }

        .product {
            background: white;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product h3 {
            margin: 12px;
        }

        .price {
            color: green;
            font-weight: bold;
            margin: 10px;
        }

        button {
            background: #172554;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Shopping Store</h1>
    <p>Shop Your Favourite Products</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
</nav>

<div class="search">
    <input type="text" id="searchInput"
    placeholder="Search products..."
    oninput="searchProducts()">
</div>

<section class="products" id="products">

    <div class="product">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
        alt="Headphones">
        <h3>Wireless Headphones</h3>
        <p class="price">₹1,499</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
        alt="Watch">
        <h3>Smart Watch</h3>
        <p class="price">₹2,499</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
        alt="Shoes">
        <h3>Sports Shoes</h3>
        <p class="price">₹1,999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

</section>

<section id="cart" style="text-align:center;padding:25px;">
    <h2>Shopping Cart</h2>
    <p>Items in your cart: <span id="cartItems">0</span></p>
</section>

<footer>
    <p>© 2026 Online Shopping Store</p>
</footer>

<script>
    let count = 0;

    function addToCart() {
        count++;
        document.getElementById("cartCount").innerText = count;
        document.getElementById("cartItems").innerText = count;
        alert("Product added to cart!");
    }

    function searchProducts() {
        let input = document.getElementById("searchInput")
            .value.toLowerCase();

        let products = document.querySelectorAll(".product");

        products.forEach(product => {
            let name = product.querySelector("h3")
                .innerText.toLowerCase();

            product.style.display =
                name.includes(input) ? "block" : "none";
        });
    }
</script>

</body>
</html>
